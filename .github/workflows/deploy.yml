name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # source fonts (~30 MB) are downloaded once, then reused: every new post can bring new CJK characters to subset
      - uses: actions/cache@v6
        with:
          path: .fonts-cache
          key: fonts-v1
      - name: Install, check, build, and upload
        uses: withastro/action@v6
        with:
          node-version: 24
          build-cmd: npm run check && npm test && npm run build && npm run test:fonts

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
